name: Canonical launch contract (read-only)
on:
  pull_request:
    paths:
      - 'tests/canonical-launch-contract*'
      - '.github/workflows/canonical-launch-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/canonical-launch-contract.test.js
