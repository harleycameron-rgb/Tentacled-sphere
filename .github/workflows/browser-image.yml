name: Prepare verified browser image
on:
  push:
    branches: ["audit/browser-image-20261019"]
    paths: ["tools/browser-audit-image/**", ".github/workflows/browser-image.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after reviewed Vercel OIDC setup
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/browser-audit-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and verify offline browser
        run: bash build-local.sh
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build-and-smoke
    environment: browser-image-publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Repeat build and smoke check before authentication
        working-directory: tools/browser-audit-image
        run: bash build-local.sh
      - uses: vercel/vcr-action/login@6888f841cb0d2255ef9dab40f068cba07234ef47
        with:
          team: team_FvvGW28W3COeiV8AqQKY3ZA3
      - name: Publish reviewed image
        working-directory: tools/browser-audit-image
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/base-image.json','utf8')).resolvedBase)")"
          docker buildx build --platform linux/amd64 --build-arg "BASE_IMAGE=$base" --tag vcr.vercel.com/waxtablet/waxtablet-integration-audit/browser-audit:pw1.64.0 --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true .
